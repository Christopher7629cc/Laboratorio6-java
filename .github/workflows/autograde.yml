name: Autograde Lab6

# NO MODIFICAR ESTE ARCHIVO
# El autograde verifica la integridad de este workflow.

on:
  push:
    branches-ignore:
      - main
  pull_request:
    # NO usar pull_request_target (riesgo de seguridad con forks)
  workflow_dispatch:

permissions:
  contents: read
  # Solo lectura - nunca escribir en el repo del estudiante ni comentar PRs

jobs:
  autograde:
    name: Autograde
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código del estudiante
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necesario para analizar historial de commits

      - name: Configurar Java 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Determinar rama actual
        id: rama
        run: |
          if [ -n "$GITHUB_HEAD_REF" ]; then
            echo "RAMA=$GITHUB_HEAD_REF" >> $GITHUB_ENV
          else
            echo "RAMA=$GITHUB_REF_NAME" >> $GITHUB_ENV
          fi
          echo "Rama detectada: $RAMA"

      - name: Descargar autograde oficial y verificar integridad
        id: descarga_oficial
        run: |
          REPO_OFICIAL="SarmientoEdu/Laboratorio6-java"
          OFICIAL_OK=false

          # Intentar descargar autograde.java oficial
          if curl -sf \
            "https://raw.githubusercontent.com/${REPO_OFICIAL}/main/autograde.java" \
            -o autograde_oficial.java 2>/dev/null; then

            # Comparar hashes
            HASH_LOCAL=$(sha256sum autograde.java | cut -d' ' -f1)
            HASH_OFICIAL=$(sha256sum autograde_oficial.java | cut -d' ' -f1)

            if [ "$HASH_LOCAL" != "$HASH_OFICIAL" ]; then
              echo "::warning::⚠️ autograde.java fue MODIFICADO respecto al oficial"
              echo "AUTOGRADE_MODIFICADO=true" >> $GITHUB_ENV
            else
              echo "✅ autograde.java íntegro"
              echo "AUTOGRADE_MODIFICADO=false" >> $GITHUB_ENV
            fi

            # Usar el oficial para la evaluación
            cp autograde_oficial.java autograde.java
            OFICIAL_OK=true
          fi

          # Verificar workflow oficial
          if curl -sf \
            "https://raw.githubusercontent.com/${REPO_OFICIAL}/main/.github/workflows/autograde.yml" \
            -o autograde_oficial.yml 2>/dev/null; then

            HASH_YML_LOCAL=$(sha256sum .github/workflows/autograde.yml | cut -d' ' -f1)
            HASH_YML_OFICIAL=$(sha256sum autograde_oficial.yml | cut -d' ' -f1)

            if [ "$HASH_YML_LOCAL" != "$HASH_YML_OFICIAL" ]; then
              echo "::warning::⚠️ autograde.yml fue MODIFICADO respecto al oficial"
              echo "WORKFLOW_MODIFICADO=true" >> $GITHUB_ENV
            else
              echo "WORKFLOW_MODIFICADO=false" >> $GITHUB_ENV
            fi
          fi

          if [ "$OFICIAL_OK" != "true" ]; then
            echo "::notice::Usando autograde.java local (descarga falló - red o repo no accesible)"
            echo "AUTOGRADE_MODIFICADO=desconocido" >> $GITHUB_ENV
          fi

      - name: Compilar autograde
        run: |
          javac autograde.java
          echo "autograde compilado OK"

      - name: Ejecutar autograde con modo headless
        id: autograde_run
        run: |
          export JAVA_TOOL_OPTIONS="-Djava.awt.headless=true"
          java autograde > autograde_output.txt 2>&1 || true
          cat autograde_output.txt

      - name: Leer nota del JSON
        id: nota
        run: |
          if [ -f resultado_autograde.json ]; then
            NOTA=$(python3 -c "import json; d=json.load(open('resultado_autograde.json')); print(d.get('nota_total',0))")
            PLAGIO=$(python3 -c "import json; d=json.load(open('resultado_autograde.json')); print(d.get('observacion_plagio','N/A'))")
            echo "NOTA=$NOTA" >> $GITHUB_ENV
            echo "PLAGIO=$PLAGIO" >> $GITHUB_ENV
          else
            echo "NOTA=0" >> $GITHUB_ENV
            echo "PLAGIO=ERROR" >> $GITHUB_ENV
            NOTA=0
          fi

      - name: Crear issue si hay commits rápidos
        if: env.NOTA != '' && hashFiles('issue_pendiente.txt') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f issue_pendiente.txt ]; then
            while IFS= read -r linea; do
              gh issue create \
                --title "⚠️ Alerta de tiempo: ${{ env.RAMA }}" \
                --body "**Detección automática de commit rápido**

          $linea

          **Rama:** ${{ env.RAMA }}
          **Nota actual:** ${{ env.NOTA }}/100

          > Esto es un indicio, no una prueba de plagio. El profesor tomará la decisión final." \
                --repo "$GITHUB_REPOSITORY" || true
            done < issue_pendiente.txt
          fi

      - name: Escribir Job Summary
        run: |
          echo "## 🎓 Resultado Autograde — Laboratorio 6" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Nota Total** | **${{ env.NOTA }} / 100** |" >> $GITHUB_STEP_SUMMARY
          echo "| Rama | \`${{ env.RAMA }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Observación Plagio | ${{ env.PLAGIO }} |" >> $GITHUB_STEP_SUMMARY
          echo "| autograde.java modificado | ${{ env.AUTOGRADE_MODIFICADO }} |" >> $GITHUB_STEP_SUMMARY
          echo "| workflow modificado | ${{ env.WORKFLOW_MODIFICADO }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f resultado_autograde.json ]; then
            echo "### Detalles por ejercicio" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat resultado_autograde.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ Las observaciones de plagio son indicios, no pruebas. El profesor decide." >> $GITHUB_STEP_SUMMARY

      - name: Subir artifact resultado
        uses: actions/upload-artifact@v4
        with:
          name: resultado-autograde
          path: resultado_autograde.json
          retention-days: 30

      - name: Fallar si nota < 60
        run: |
          NOTA="${{ env.NOTA }}"
          if [ -z "$NOTA" ] || [ "$NOTA" -lt 60 ]; then
            echo "❌ Nota $NOTA < 60. El job falla para indicar entrega incompleta."
            exit 1
          else
            echo "✅ Nota $NOTA ≥ 60. Entrega aceptada."
          fi
